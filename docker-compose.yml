# Имя проекта задано явно, чтобы контейнеры и тома бота не смешивались
# с другими compose-проектами на этом сервере.
name: vk-claude-bot

services:
  bot:
    build: .
    container_name: vk-claude-bot
    env_file: .env
    # PID 1 = init, иначе Python не получит SIGTERM при docker stop.
    init: true

    # Принципиально именно on-failure, а не unless-stopped:
    #   падение (ненулевой код)      -> Docker поднимает обратно;
    #   выключение стоп-фразой (код 0) -> контейнер остаётся остановленным.
    # С unless-stopped стоп-фраза превратилась бы в бесконечный перезапуск.
    restart: on-failure

    volumes:
      # Весь изменяемый стейт бота: state.json, вложения, метка kill и — в
      # claude-home — транскрипты сессий Claude Code, на которых держится resume.
      #
      # Именно bind-mount, а не именованный том: том Docker создаёт от root, и
      # процесс под uid 10001 не может в него писать. Здесь права выставляет
      # deploy.sh при заливке, и весь стейт лежит одной папкой.
      - ./workspace:/app/workspace
      # Домашняя папка целиком, а не только .claude: рядом с транскриптами CLI
      # держит .claude.json, и без него он при каждом запуске жалуется на
      # потерянный конфиг и восстанавливается из бэкапа.
      - ./workspace/home:/home/bot

    # Логи не должны съесть диск на сервере с соседними проектами.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Потолки подобраны по замеру на живом сервере: в покое бот держит ~50 МБ,
    # пик на запросе с веб-поиском — ~400 МБ. Сервер: 1 ядро, 955 МБ RAM, 2.3 ГБ
    # swap, рядом работает VPN, которому падать нельзя.
    #
    # mem_limit бьёт по контейнеру, а не по хосту: при превышении ядро убивает
    # процесс внутри, контейнер поднимается заново (restart: on-failure), а
    # соседние сервисы не замечают ничего.
    mem_limit: 640m
    # Суммарно память + swap. Разница с mem_limit — 640 МБ swap на всплески:
    # лучше пару секунд подтормозить, чем словить OOM.
    memswap_limit: 1280m

    # Ядро всего одно. Жёсткий потолок оставляет пятую часть системе, а
    # заниженный вес отдаёт процессор VPN всякий раз, когда они спорят за него
    # (по умолчанию вес 1024).
    cpus: 0.8
    cpu_shares: 512

    # Форк-бомба из зациклившегося агента не должна исчерпать таблицу процессов.
    pids_limit: 256

    # Если памяти не хватит всему хосту, ядро должно выбрать бота, а не VPN:
    # чем выше значение, тем охотнее OOM-killer берётся именно за этот процесс.
    oom_score_adj: 800
